# Fixture of the workflow template lint (tests/workflow_templates.rs).
# Every push to a pull request's branch runs it twice.
name: Fixture

on:
  push:
  pull_request:

permissions: {}

jobs:
  job:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
