# The side matrix of projects made by `mod init` (`mod test`), in a workflow of
# its own so that GitHub filters its pull requests by path: it is the longest
# job, so it runs on a pull request only when the change touches what it tests,
# and on every push to main. `paths` takes every file, then leaves out what
# neither `mod init` nor `mod test` runs, so a new file runs the matrix by
# default: take a file off that list once the side matrix depends on it.
# GitHub matches only the first 300 changed files of a pull request, so a larger
# one whose relevant files come later skips the matrix; main still runs it.
name: Side matrix

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!scripts/**"
      - "!.claude/**"
      - "!.github/**"
      - .github/workflows/mod-sides.yml
      - "!crates/modpack/**"
      - "!crates/mc-core/src/auth.rs"
      - "!crates/mc-core/src/page.rs"
      - "!crates/mc-core/src/platform/**"
      - "!crates/mc-core/src/resolve.rs"
      - "!crates/mc-core/src/secrets/**"
      - "!crates/mod/src/cli/port.rs"
      - "!crates/mod/src/cli/run.rs"
      - "!crates/mod/src/cli/setup.rs"
      - "!crates/mod/src/cli/update.rs"
      - "!crates/mod/src/github.rs"
      - "!crates/mod/src/github/**"
      - "!crates/mod/src/model/test_profile.rs"
      - "!crates/mod/src/run/**"
      - "!crates/mod/templates/socle/.claude/**"
      - "!crates/mod/templates/socle/.github/**"
      - "!crates/mod/tests/**"
      - crates/mod/tests/side_matrix.rs

# A newer push to a pull request cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `mod init` commits the `design` branch, which needs a git identity; the
  # runner has none.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  # The side matrix of projects made by `mod init` (`mod test`): a dedicated
  # server and a HeadlessMC client with different mod sets, for each side on
  # both loaders, and each case on its deliberate defect. One job, so that the
  # generated mods share one Gradle cache: parallel jobs got throttled by Maven
  # Central (HTTP 429).
  mod-sides:
    runs-on: ubuntu-24.04
    # The game servers and clients it starts could hang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Day of the Gradle dependency cache
        id: gradle-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ steps.gradle-day.outputs.day }}-${{ hashFiles('crates/mod/src/versions.rs', 'crates/mod/templates/socle/**/*.gradle*', 'crates/mod/templates/socle/**/*.kt', 'crates/mod/templates/socle/**/*.properties', 'crates/mod/templates/skeleton/*.gradle*') }}
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mc-mod --locked --test side_matrix -- --ignored --test-threads=1 --nocapture
        env:
          MOD_SIDES_ARTIFACTS: ${{ runner.temp }}/mod-sides
      - name: Upload the logs of the generated mods
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-sides
          path: ${{ runner.temp }}/mod-sides/
          if-no-files-found: ignore
