name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-test-executables.sh
      # The runner's rustup, not a third-party action: dtolnay/rust-toolchain
      # publishes no versioned release to pin.
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that every action is pinned by commit SHA
        run: |
          bash scripts/check-workflow-pins.sh
          bash scripts/check-workflow-pins.sh crates/mod/templates/socle/.github/workflows/*.yml
      - name: Test that check
        run: bash scripts/test-check-workflow-pins.sh
      # A pinned release, checked against its published checksum. The runner's
      # shellcheck lints the `run` scripts too. The socles' workflow templates are
      # linted with this repository's own workflows: they ship into every project.
      - name: Lint the workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint -color .github/workflows/*.yml crates/modpack/templates/socle/.github/workflows/*.yml crates/mod/templates/socle/.github/workflows/*.yml

  # Builds projects made by `mod init` with Gradle: both loaders, each alone,
  # the loader metadata for each side, the client split of `common`, and the
  # shared library with its tests, client gametests included: same packages
  # and environment as the mod-tests job.
  mod-build:
    runs-on: ubuntu-24.04
    # The game servers of the generated mods' checks could hang.
    timeout-minutes: 45
    env:
      SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Install the virtual display and the software renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mc-mod --locked --test gradle_build -- --ignored --test-threads=1

  # The test pyramid of a project made by `mod init`: each layer's example
  # passes and each guard catches its defect. Same packages and environment as
  # the client job of the mod's workflow (templates/socle/.github/workflows).
  mod-tests:
    runs-on: ubuntu-24.04
    # The game servers and clients it starts could hang.
    timeout-minutes: 60
    env:
      SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Install the virtual display and the software renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mc-mod --locked --test test_pyramid -- --ignored --test-threads=1
        env:
          MOD_TESTS_ARTIFACTS: ${{ runner.temp }}/mod-tests
      - name: Upload the renders and logs of the generated mods
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-tests
          path: ${{ runner.temp }}/mod-tests/
          if-no-files-found: ignore

  # The end-to-end test of the socle: the `mod` binary makes a mod (both
  # loaders, both sides required), which builds and passes every test layer,
  # the shared library's tests included, as the mod's own CI runs them
  # (templates/socle/.github/workflows/mod-tests.yml). The Gradle caches are
  # keyed on what sets the mod's dependencies: the pinned versions and the
  # socle's Gradle files. Measured on 2026-11-20: about 5 min 15 s without
  # the Gradle cache (Gradle 3 min 15 s to 3 min 40 s), 3 min 15 s with it
  # (Gradle 1 min 45 s).
  socle-e2e:
    runs-on: ubuntu-24.04
    # The game servers and clients it starts could hang.
    timeout-minutes: 45
    env:
      SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
    steps:
      # The job's `env` cannot read the runner context.
      - run: echo "MOD_DIR=$RUNNER_TEMP/swift_blades" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            crates/mod/src/versions.rs
            crates/mod/templates/socle/**/*.gradle*
            crates/mod/templates/socle/gradle.properties
            crates/mod/templates/socle/gradle/wrapper/gradle-wrapper.properties
      - name: Install the virtual display and the software renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the binaries
        run: cargo build --workspace --bins --locked
      - name: Make a mod with `mod init`
        run: >-
          target/debug/mod init "$MOD_DIR"
          --id=swift_blades --name="Swift Blades" --package=com.payangar.swiftblades
          --loaders=fabric,neoforge --side=both-required --license=MIT --mc-version=26.3
      - name: Build the mod and run every test layer
        working-directory: ${{ env.MOD_DIR }}
        run: ./gradlew --console=plain build clientCheck
      # A test task only fails when it ran no test at all: count the library's.
      - name: Check that every test of the shared library ran
        run: |
          for subproject in common neoforge; do
            expected=$(grep -rhE '^\s*@Test(\s|$)' "crates/mod/templates/library/$subproject/src/test/java" | wc -l)
            ran=$(cat "$MOD_DIR/$subproject"/build/test-results/test/TEST-*.xml \
              | { grep -oE '<testcase [^>]*classname="com\.payangar\.swiftblades\.vendor\.' || true; } | wc -l)
            echo "$subproject: $ran of the library's $expected tests ran"
            if [ "$ran" -ne "$expected" ] || [ "$expected" -eq 0 ]; then
              echo "::error::$subproject ran $ran of the shared library's $expected tests"
              exit 1
            fi
          done
      - name: Upload the reports and logs of the mod
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socle-e2e
          path: |
            ${{ env.MOD_DIR }}/*/build/reports/
            ${{ env.MOD_DIR }}/*/build/test-results/
            ${{ env.MOD_DIR }}/*/build/run/*/logs/
            ${{ env.MOD_DIR }}/*/build/run/*/crash-reports/
          if-no-files-found: ignore
