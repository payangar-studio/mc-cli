name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-test-executables.sh
      # The runner's rustup, not a third-party action: dtolnay/rust-toolchain
      # publishes no versioned release to pin.
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that every action is pinned by commit SHA
        run: bash scripts/check-workflow-pins.sh
      - name: Test that check
        run: bash scripts/test-check-workflow-pins.sh
      # A pinned release, checked against its published checksum. The runner's
      # shellcheck lints the `run` scripts too. The socle's workflow template is
      # linted with this repository's own workflows: it ships into every pack.
      - name: Lint the workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint -color .github/workflows/*.yml crates/modpack/templates/socle/.github/workflows/*.yml

  # Builds projects made by `mod init` with Gradle: both loaders, each alone,
  # the loader metadata for each side, the client split of `common`.
  mod-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mc-mod --locked --test gradle_build -- --ignored --test-threads=1
