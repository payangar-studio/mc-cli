name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - name: Archive each binary with its checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Every binary of the workspace, one archive each: a new binary
          # crate is released without changing this workflow.
          bins=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')
          if [[ -z "$bins" ]]; then
            echo "::error::The workspace has no binary to release."
            exit 1
          fi
          for bin in $bins; do
            archive="${bin}-${version}-${TARGET}.tar.gz"
            tar -czf "$archive" -C "target/${TARGET}/release" "$bin"
            sha256sum "$archive" > "$archive.sha256"
            printf '%s\n' "$archive" "$archive.sha256" >> assets.txt
          done
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < assets.txt
          # A version with a suffix (v0.1.0-rc1) is a prerelease.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" --verify-tag --generate-notes \
            "${assets[@]}"
