# Spike (#9), throwaway: never merged, runs on its branch only.
name: Spike HeadlessMC

on:
  push:
    branches: [9-spike-headlessmc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - run: bash spike/headlessmc/join.sh "$RUNNER_TEMP/spike"
      - if: always()
        run: |
          echo "::group::server.log"; cat "$RUNNER_TEMP/spike/server/server.log" || true; echo "::endgroup::"
          echo "::group::client.log"; cat "$RUNNER_TEMP/spike/client.log" || true; echo "::endgroup::"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-logs
          path: |
            ${{ runner.temp }}/spike/server/server.log
            ${{ runner.temp }}/spike/client.log
            ${{ runner.temp }}/spike/game/logs/latest.log
