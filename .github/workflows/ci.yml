name: CI

# Once per push: on pull requests, and on pushes to main. A newer push to a
# pull request cancels its run still in progress.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `mod init` commits the `design` branch, which needs a git identity; the
  # runner has none.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-test-executables.sh
      # The runner's rustup, not a third-party action: dtolnay/rust-toolchain
      # publishes no versioned release to pin.
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that every action is pinned by commit SHA
        run: |
          bash scripts/check-workflow-pins.sh
          bash scripts/check-workflow-pins.sh crates/mod/templates/socle/.github/workflows/*.yml
      - name: Test that check
        run: bash scripts/test-check-workflow-pins.sh
      # A pinned release, checked against its published checksum. The runner's
      # shellcheck lints the `run` scripts too. The socles' workflow templates are
      # linted with this repository's own workflows: they ship into every project.
      - name: Lint the workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint -color .github/workflows/*.yml crates/modpack/templates/socle/.github/workflows/*.yml crates/mod/templates/socle/.github/workflows/*.yml

  # Builds projects made by `mod init` with Gradle: both loaders, each alone,
  # the loader metadata for each side, the client split of `common`, and the
  # shared library with its tests, client gametests included: same packages
  # and environment as the mod-tests job.
  mod-build:
    runs-on: ubuntu-24.04
    # The game servers of the generated mods' checks could hang.
    timeout-minutes: 45
    env:
      SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      # The dependencies the generated mods download (Maven artifacts and the
      # Gradle distribution), kept between runs so that a burst of runs does not
      # get throttled by Maven Central (HTTP 429). One cache per job: a cache is
      # saved once per key, so a shared key would miss what only the other jobs
      # resolve. The key changes every day and with what sets those
      # dependencies, so nothing is kept longer than a day. Gradle's build cache stays out: a later run
      # would take the test results from it instead of running the tests.
      - name: Day of the Gradle dependency cache
        id: gradle-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ github.job }}-${{ steps.gradle-day.outputs.day }}-${{ hashFiles('crates/mod/src/versions.rs', 'crates/mod/templates/socle/**/*.gradle*', 'crates/mod/templates/socle/**/*.kt', 'crates/mod/templates/socle/**/*.properties', 'crates/mod/templates/skeleton/*.gradle*') }}
      - name: Install the virtual display and the software renderers
        # A stuck Ubuntu mirror once held a job until its own timeout: apt
        # gives up on a silent connection, and the step on a slow mirror.
        timeout-minutes: 10
        run: |
          apt='sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3'
          for attempt in 1 2 3; do
            $apt update && $apt install -y xvfb mesa-vulkan-drivers && exit 0
            sleep 15
          done
          exit 1
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mc-mod --locked --test gradle_build -- --ignored --test-threads=1

  # The test pyramid of a project made by `mod init`: each layer's example
  # passes and each guard catches its defect. Same packages and environment as
  # the client job of the mod's workflow (templates/socle/.github/workflows).
  # `every_layer_passes` is the end-to-end test of the socle: a mod with both
  # loaders builds and passes every test layer, the shared library's tests
  # included.
  mod-tests:
    runs-on: ubuntu-24.04
    # The game servers and clients it starts could hang.
    timeout-minutes: 60
    env:
      SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Day of the Gradle dependency cache
        id: gradle-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ github.job }}-${{ steps.gradle-day.outputs.day }}-${{ hashFiles('crates/mod/src/versions.rs', 'crates/mod/templates/socle/**/*.gradle*', 'crates/mod/templates/socle/**/*.kt', 'crates/mod/templates/socle/**/*.properties', 'crates/mod/templates/skeleton/*.gradle*') }}
      - name: Install the virtual display and the software renderers
        # A stuck Ubuntu mirror once held a job until its own timeout: apt
        # gives up on a silent connection, and the step on a slow mirror.
        timeout-minutes: 10
        run: |
          apt='sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3'
          for attempt in 1 2 3; do
            $apt update && $apt install -y xvfb mesa-vulkan-drivers && exit 0
            sleep 15
          done
          exit 1
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mc-mod --locked --test test_pyramid -- --ignored --test-threads=1
        env:
          MOD_TESTS_ARTIFACTS: ${{ runner.temp }}/mod-tests
      - name: Upload the renders and logs of the generated mods
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-tests
          path: ${{ runner.temp }}/mod-tests/
          if-no-files-found: ignore

  # `mod run` on a project made by `mod init`: with `--server`, the client,
  # on a virtual display with software rendering, joins the dev server; a CI
  # profile with Sodium passes the steps of the mod workflow's `profile` job.
  mod-run:
    runs-on: ubuntu-24.04
    # The game servers and clients it starts could hang.
    timeout-minutes: 60
    env:
      # Keeps SDL on OpenGL with Mesa's software renderer.
      SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Day of the Gradle dependency cache
        id: gradle-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ github.job }}-${{ steps.gradle-day.outputs.day }}-${{ hashFiles('crates/mod/src/versions.rs', 'crates/mod/templates/socle/**/*.gradle*', 'crates/mod/templates/socle/**/*.kt', 'crates/mod/templates/socle/**/*.properties', 'crates/mod/templates/skeleton/*.gradle*') }}
      - name: Install the virtual display and the software renderers
        # A stuck Ubuntu mirror once held a job until its own timeout: apt
        # gives up on a silent connection, and the step on a slow mirror.
        timeout-minutes: 10
        run: |
          apt='sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3'
          for attempt in 1 2 3; do
            $apt update && $apt install -y xvfb mesa-vulkan-drivers && exit 0
            sleep 15
          done
          exit 1
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p mc-mod --locked --test mod_run -- --ignored --nocapture --test-threads=1
        env:
          MOD_TESTS_ARTIFACTS: ${{ runner.temp }}/mod-run
      - name: Upload the logs of the generated mods
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-run
          path: ${{ runner.temp }}/mod-run/
          if-no-files-found: ignore
