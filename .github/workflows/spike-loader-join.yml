# Throwaway experiment (#10), removed before merge.
name: Spike loader join
on:
  push:
    branches: [10-two-process-harness]
permissions:
  contents: read
jobs:
  join:
    strategy:
      fail-fast: false
      matrix:
        loader: [neoforge]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - run: bash spike/loader-join.sh "${{ matrix.loader }}" "$RUNNER_TEMP/join"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.loader }}
          path: |
            ${{ runner.temp }}/join/client.log
            ${{ runner.temp }}/join/server/server.log
            ${{ runner.temp }}/join/server/logs/
            ${{ runner.temp }}/join/game/logs/
